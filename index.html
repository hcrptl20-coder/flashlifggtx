<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Flash Light</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.2s;
        }

        #flash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .btn {
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            width: 80%;
            max-width: 300px;
            transition: transform 0.1s;
        }

        #startBtn {
            background-color: #00ff00;
            color: #000;
        }

        #offBtn {
            background-color: #ff0000;
            color: #fff;
            display: none; /* Hidden initially */
        }

        #payment-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 24px 16px;
            box-sizing: border-box;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #payment-modal .payment-qr {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 220px;
            min-height: 220px;
            margin: 14px auto;
            padding: 8px;
            box-sizing: content-box;
            border-radius: 10px;
            background: #fff;
        }

        #payment-modal .payment-qr img,
        #payment-modal .payment-qr canvas {
            max-width: 100%;
        }

        #payment-modal .qr-status {
            min-height: 18px;
            font-size: 13px;
        }

        #payment-modal .whatsapp-number {
            color: #25D366;
            font-weight: bold;
        }

        .upi-box {
            border: 2px solid #fff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .upi-id {
            font-size: 20px;
            background: #333;
            padding: 10px;
            margin: 10px 0;
            word-break: break-all;
            font-family: monospace;
        }

        .pay-btn {
            background-color: #25D366;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .hidden-notice {
            margin-top: auto;
            margin-bottom: 20px;
            font-size: 14px;
            color: #888;
            text-align: center;
        }

        /* Full brightness overlay */
        #brightness-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            pointer-events: none;
            z-index: 999;
            display: none;
        }
    </style>
</head>
<body>

    <div id="flash-container">
        <button id="startBtn" class="btn" onclick="startFlash()">Start</button>
        <button id="offBtn" class="btn" onclick="showPayment()">Off</button>
        <div class="hidden-notice">WhatsApp: 7873078593</div>
    </div>

    <div id="brightness-overlay"></div>

    <div id="payment-modal">
        <h2>Pay to Turn Off</h2>
        <div class="upi-box">
            <p>Scan QR or use the direct UPI button:</p>
            <div id="payment-qr" class="payment-qr" role="img" aria-label="UPI payment QR code"></div>
            <p id="payment-qr-status" class="qr-status" aria-live="polite">Preparing your payment QR code...</p>
            <div class="upi-id">officialccshop@nyes</div>
            <p>Amount: <strong>₹499</strong></p>
        </div>
        <a href="upi://pay?pa=officialccshop%40nyes&amp;pn=FlashLock&amp;am=499.00&amp;cu=INR" class="pay-btn">Pay ₹499 Now</a>
        <p style="margin-top:16px;">WhatsApp: <a class="whatsapp-number" href="https://wa.me/917873078593">7873078593</a></p>
        <p style="margin-top:20px; font-size:12px;">(Light will only turn off after payment verification)</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        let ledLock = null;
        let isFlashOn = false;
        let longPressTimer = null;
        let resetTimer = null;
        const upiPaymentLink = 'upi://pay?pa=officialccshop%40nyes&pn=FlashLock&am=499.00&cu=INR';

        function renderPaymentQr() {
            const qrContainer = document.getElementById('payment-qr');
            const qrStatus = document.getElementById('payment-qr-status');
            if (qrContainer.childElementCount > 0) return;

            if (typeof QRCode === 'undefined') {
                qrStatus.textContent = 'QR could not load. Please use the direct UPI button or UPI ID.';
                return;
            }

            try {
                new QRCode(qrContainer, {
                    text: upiPaymentLink,
                    width: 220,
                    height: 220,
                    correctLevel: QRCode.CorrectLevel.M
                });
                qrStatus.textContent = 'Scan to pay using your UPI app.';
            } catch (error) {
                qrStatus.textContent = 'QR could not be generated. Please use the direct UPI button or UPI ID.';
                console.error('Unable to generate the UPI payment QR code.', error);
            }
        }

        // Set screen brightness to max
        function setMaxBrightness() {
            if (screen && screen.avoidWakeLock) {
                screen.avoidWakeLock();
            }
            if (navigator && navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
                // Attempt to lock screen brightness via display lock if supported
                if (screen && screen.lock) {
                    screen.lock();
                }
            }
            // Fallback: Just ensure body background is white or overlay is visible
            document.getElementById('brightness-overlay').style.display = 'block';
            document.body.style.backgroundColor = '#fff';
        }

        async function startFlash() {
            isFlashOn = true;
            setMaxBrightness();
            
            // Toggle Start/Off buttons
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('offBtn').style.display = 'block';

            // Try to access LED via Web API
            if (navigator.hardware && navigator.hardware.bluetooth && navigator.hardware.bluetooth.gatt) {
                // Specific logic for Bluetooth LE devices if needed, but for standard phones:
            }

            // Use Android specific WakeLock or simple interval to keep light on
            // Note: Standard Web API for flashlight is limited, this simulates persistence.
            try {
                const capabilities = await navigator.locks.request('flashlight', async () => {
                    // This simulates holding the lock
                    return true;
                });
            } catch (e) {
                console.log("Lock attempted", e);
            }

            // Aggressive interval to keep "light" on (simulated brightness)
            setInterval(() => {
                if (isFlashOn) {
                    // Force re-render to prevent browser optimization of turning off
                    document.body.style.backgroundColor = '#fff';
                    document.body.style.backgroundColor = '#000';
                    document.body.style.backgroundColor = '#fff';
                }
            }, 100);

            // Hidden Feature: Hold Start button logic (even though it's hidden, we attach listener to container or recreate button logic)
            // Since Start is hidden, we attach the long press logic to the "Off" button or the container as per "Start pe wapis 10 sec" instruction.
            // Re-adding Start button invisibly to capture the hold.
            const hiddenStart = document.getElementById('startBtn');
            
            hiddenStart.addEventListener('mousedown', holdStart);
            hiddenStart.addEventListener('touchstart', holdStart);
            hiddenStart.addEventListener('mouseup', releaseStart);
            hiddenStart.addEventListener('touchend', releaseStart);
        }

        function showPayment() {
            document.getElementById('payment-modal').style.display = 'flex';
            renderPaymentQr();
        }

        // Hidden Logic: Hold for 10 seconds to turn off
        function holdStart(e) {
            e.preventDefault();
            resetTimer = setTimeout(() => {
                if (isFlashOn) {
                    stopFlash();
                }
            }, 10000); // 10 seconds
        }

        function releaseStart(e) {
            clearTimeout(resetTimer);
        }

        function stopFlash() {
            isFlashOn = false;
            document.body.style.backgroundColor = '#000';
            document.getElementById('brightness-overlay').style.display = 'none';
            document.getElementById('payment-modal').style.display = 'none';
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('offBtn').style.display = 'none';
            if (resetTimer) clearTimeout(resetTimer);
        }

        // Initialize
        document.body.style.backgroundColor = '#000';
    </script>
</body>
</html>
